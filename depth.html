<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEPTH — Cold War Submarine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════
// DEPTH — Cold War Submarine Survival
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 640, H = 480;
canvas.width = W; canvas.height = H;
ctx.imageSmoothingEnabled = false;

// ── PALETTE ─────────────────────────────────────────────
const P = {
  black:   '#050a05',
  hull:    '#1a2018',
  hullDk:  '#0e1410',
  steel:   '#2a3528',
  rivet:   '#3a4838',
  green:   '#39ff14',
  greenDk: '#1a7a08',
  greenDm: '#0a3a04',
  amber:   '#ff8c00',
  amberDk: '#7a3a00',
  red:     '#cc2200',
  redBrt:  '#ff3300',
  blue:    '#004488',
  water:   '#001830',
  rust:    '#5a2a10',
  text:    '#88cc88',
  textBrt: '#aaffaa',
  dim:     '#334433',
  white:   '#ccddcc',
  yellow:  '#cccc00',
};

// ── STATE ────────────────────────────────────────────────
let state = 'intro'; // intro|playing|dead|win
let frameCount = 0;
let introTimer = 0;

// Sub systems
let depth = 0;        // metres, increases over time
let maxDepth = 800;   // survive to this depth = win
let hull = 100;       // 0 = sunk
let oxygen = 100;     // 0 = dead
let fuel = 100;       // 0 = dead stop
let floodLevel = 0;   // 0-100, slows player, drains O2
let score = 0;
let bonusScore = 0;   // event/salvage bonuses (added to score formula)
let missionTime = 0;

// Rates (per second at surface, worsen with depth)
const BASE_O2_DRAIN    = 0.55;   // balanced: was 0.8
const BASE_FUEL_DRAIN  = 0.34;   // balanced: was 0.5
const BASE_DEPTH_RATE  = 0.4; // m/s descent

// Breach events
let breaches = [];      // hull holes
let nextBreachTime = 0;

// Notes log
let sonarPings = [];    // { x, y, type, logged }
let logEntries = [];
let nextPingTime = 0;

// ── INPUT ────────────────────────────────────────────────
const keys = {};
const mouse = { x: 0, y: 0, down: false, clicked: false };
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter' && state === 'intro') initGame();
  if (e.key === 'Enter' && (state === 'dead' || state === 'win')) initGame();
  if (e.key === 'Escape') {
    if (state === 'playing' && !activeStation) state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (e.key === 'Enter' && state === 'paused') state = 'playing';
  e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('mousedown', () => { mouse.down = true; mouse.clicked = true; });
canvas.addEventListener('mouseup',   () => { mouse.down = false; });

// ── SOUND (tiny synth) ───────────────────────────────────
let AC = null;
function sfx(type) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if (type === 'klaxon') { o.type='square'; o.frequency.setValueAtTime(440,t); o.frequency.setValueAtTime(330,t+0.18); g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.36); o.start(t); o.stop(t+0.36); }
    else if (type === 'boom') { o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(35,t+0.35); g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t); o.stop(t+0.4); }
    else if (type === 'weld') { o.type='square'; o.frequency.value=90+Math.random()*50; g.gain.setValueAtTime(0.03,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05); o.start(t); o.stop(t+0.05); }
    else if (type === 'valve') { o.type='triangle'; o.frequency.setValueAtTime(500,t); o.frequency.setValueAtTime(650,t+0.04); g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09); o.start(t); o.stop(t+0.09); }
    else if (type === 'chime') { o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.setValueAtTime(660,t+0.08); o.frequency.setValueAtTime(880,t+0.16); g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); o.start(t); o.stop(t+0.3); }
    else if (type === 'pump') { o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(70,t+0.12); g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13); o.start(t); o.stop(t+0.13); }
    else if (type === 'ping') { o.type='sine'; o.frequency.setValueAtTime(880,t); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t); o.stop(t+0.4); }
    else if (type === 'creak') { o.type='sawtooth'; o.frequency.setValueAtTime(60+Math.random()*40,t); o.frequency.linearRampToValueAtTime(45,t+0.5); g.gain.setValueAtTime(0.03,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.55); o.start(t); o.stop(t+0.55); }
    else if (type === 'beep') { o.type='square'; o.frequency.setValueAtTime(1100,t); g.gain.setValueAtTime(0.045,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07); o.start(t); o.stop(t+0.07); }
    else if (type === 'whoosh') { o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(420,t+0.35); g.gain.setValueAtTime(0.06,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t); o.stop(t+0.4); }
    else if (type === 'scrape') { o.type='sawtooth'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(60,t+0.3); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.32); o.start(t); o.stop(t+0.32); }
  } catch(e) {}
}

// ── ALERT BANNERS + SCREEN SHAKE ─────────────────────────
let alerts = [];   // { text, timer, max, color }
let shake = 0;
function pushAlert(text, color, time) {
  alerts.push({ text, color: color || '#ff4444', timer: time || 180, max: time || 180 });
  if (alerts.length > 3) alerts.shift();
}

// ── COLLISION COURSE EVENTS (gives the Helm a purpose) ───
let collisionEvt = null;      // { phase:'warn'|'dodge', timer, hits }
let nextCollisionTime = 0;

// ── SUB LAYOUT ───────────────────────────────────────────
// Interior rooms from left to right inside the sub
const SUB_X = 60, SUB_Y = 160, SUB_W = 520, SUB_H = 160;
const FLOOR_Y = SUB_Y + SUB_H - 40; // player walks on this

const STATIONS = [
  { id:'hull',    name:'HULL REPAIR',   x: SUB_X + 40,  icon:'⚙', key:'1' },
  { id:'steer',   name:'HELM',          x: SUB_X + 140, icon:'◎', key:'2' },
  { id:'oxygen',  name:'O² TANKS',      x: SUB_X + 250, icon:'◈', key:'3' },
  { id:'fuel',    name:'ENGINE',        x: SUB_X + 360, icon:'⛽', key:'4' },
  { id:'notes',   name:'SONAR/LOG',     x: SUB_X + 460, icon:'◉', key:'5' },
];

// ── PLAYER ───────────────────────────────────────────────
let player = {
  x: SUB_X + 250, y: FLOOR_Y - 16,
  w: 10, h: 16,
  speed: 2.2,
  atStation: null,
  walkCycle: 0,
  facing: 1, // 1=right, -1=left
};

function nearStation() {
  for (const s of STATIONS) {
    if (Math.abs(player.x - s.x) < 30) return s;
  }
  return null;
}

// ── MINIGAME STATE ───────────────────────────────────────
let activeStation = null; // which minigame is open

// 1. HULL REPAIR — click holes to weld
let hullHoles = []; // legacy
let weldProgress = 0;
let weldTarget = null;  // legacy (kept for compat)
let weldSparks = [];    // torch sparks + steam
let sprayFx = [];       // water jets from unsealed crack segments
// Each breach lazily gets .segs: jagged crack segments to trace with the torch
function ensureCrack(b) {
  if (b.segs) return;
  const cx = mapToMiniX(b.wx), cy = mapToMiniY(b.wy);
  const n = 5 + Math.floor((b.wx * 7 + b.wy * 13) % 3);   // 5-7 segments
  const ang = ((b.wx * 31 + b.wy * 17) % 100) / 100 * Math.PI;  // crack direction
  const len = 54 + (b.w % 20);
  b.segs = [];
  let px2 = cx - Math.cos(ang) * len/2;
  let py2 = cy - Math.sin(ang) * len/2;
  for (let i = 0; i < n; i++) {
    const t2 = (i + 1) / n;
    const jag = Math.sin(i * 2.7 + b.wx) * 7;
    const nx2 = cx - Math.cos(ang) * len/2 + Math.cos(ang) * len * t2 - Math.sin(ang) * jag;
    const ny2 = cy - Math.sin(ang) * len/2 + Math.sin(ang) * len * t2 + Math.cos(ang) * jag;
    b.segs.push({ x1: px2, y1: py2, x2: nx2, y2: ny2, prog: 0 });
    px2 = nx2; py2 = ny2;
  }
}
function segDone(b) { return b.segs && b.segs.every(s => s.prog >= 1); }

// 2. STEERING — avoid obstacles
let steerY = 240;       // sub y in viewport
let steerVY = 0;
let helmX = 0;          // sub x (small fore/aft control)
let helmVX = 0;
let obstacles = [];     // { x, y, type, ... } world moves left past the sub
let steerScrollX = 0;
let steerDamage = 0;
let steerWarning = 0;   // legacy (unused)
let helmInvuln = 0;
let helmNear = 0;       // near misses this run
let helmWake = [];      // bubble trail
let helmPops = [];      // "CLOSE!" popups
let helmFx = [];        // explosion / vent particles
function helmReset() {
  steerY = 200; steerVY = 0; helmX = 0; helmVX = 0;
  obstacles = []; helmInvuln = 0; helmNear = 0;
  helmWake = []; helmPops = []; helmFx = [];
}

// 3. OXYGEN — valve puzzle
let valveState = [false, false, false, false, false]; // 5 valves
let valveTarget = [];  // correct order
let valveStep = 0;     // next valve index to hit
let valvePressure = 100; // counts down, reset on success
let valveSuccess = 0;  // flash timer

// 4. FUEL — pump rhythm
let pumpAngle = 0;
let pumpTarget = 0;    // rotating target zone
let pumpTargetWidth = 0.4;
let pumpHits = 0;
let pumpMisses = 0;
let pumpFlash = 0;
let pumpFail = 0;

// 5. NOTES — sonar log
let sonarSweep = 0;    // rotating sweep line angle
let detectedBlips = [];
let pendingLog = null;
let logSuccess = 0;
let logInput = '';

// ── WORLD ────────────────────────────────────────────────
// Background ocean particles
let bubbles = [];
for (let i = 0; i < 30; i++) {
  bubbles.push({ x: Math.random()*W, y: Math.random()*H,
    vy: -(0.3+Math.random()*0.8), r: 1+Math.random()*3, alpha: Math.random() });
}

// ── INIT ─────────────────────────────────────────────────
function initGame() {
  depth = 0; hull = 100; oxygen = 100; fuel = 100;
  floodLevel = 0; score = 0; bonusScore = 0; missionTime = 0;
  breaches = []; sonarPings = []; logEntries = [];
  hullHoles = []; weldTarget = null;
  obstacles = []; steerY = 240; steerVY = 0; steerDamage = 0;
  valveState = [false,false,false,false,false];
  valveStep = 0; valvePressure = 100; valveSuccess = 0;
  generateValveTarget();
  pumpAngle = 0; pumpHits = 0; pumpMisses = 0;
  detectedBlips = []; pendingLog = null; logInput = ''; sonarTag = 0;
  activeStation = null;
  player.x = SUB_X + 250; player.atStation = null;
  nextBreachTime = 700 + Math.floor(Math.random()*250);   // ~12-16s before first breach
  nextPingTime = 240;
  alerts = []; shake = 0;
  collisionEvt = null;
  nextCollisionTime = 1100 + Math.floor(Math.random()*500); // first contact ~20s in
  state = 'playing';
}

function generateValveTarget() {
  valveTarget = [0,1,2,3,4].sort(() => Math.random()-.5).slice(0,4);
  valveStep = 0;
  valveState = [false,false,false,false,false];
}

// ── BEST SCORE ───────────────────────────────────────────
function saveBest() {
  try {
    const best = parseInt(localStorage.getItem('depth_best') || '0');
    if (score > best) localStorage.setItem('depth_best', String(score));
  } catch(e) {}
}
function getBest() {
  try { return parseInt(localStorage.getItem('depth_best') || '0'); } catch(e) { return 0; }
}

// ── DEPTH SCALING ────────────────────────────────────────
function depthFactor() { return 1 + (depth / maxDepth) * 1.6; }  // balanced: was 2.5

// ── UPDATE ───────────────────────────────────────────────
function update() {
  frameCount++;
  if (state !== 'playing') return;
  missionTime++;

  const dt = 1/60;
  const df = depthFactor();

  // Descend
  depth = Math.min(maxDepth, depth + BASE_DEPTH_RATE * df * dt * 60 * 0.016);

  // Drain systems
  const floodPenalty = 1 + floodLevel * 0.02;
  oxygen -= BASE_O2_DRAIN * df * floodPenalty * dt;
  fuel   -= BASE_FUEL_DRAIN * df * dt;

  // Flood from hull breaches
  const totalLeak = breaches.reduce((s, b) => s + b.size, 0);
  floodLevel = Math.min(100, floodLevel + totalLeak * dt * 2);
  // bilge pumps work much better once every breach is sealed
  floodLevel = Math.max(0, floodLevel - (breaches.length === 0 ? 0.09 : 0.015));

  // Apply flood to player speed
  player.speed = 2.2 * (1 - floodLevel * 0.007);

  // Hull damage from flooding
  if (floodLevel > 60) hull -= (floodLevel - 60) * 0.012 * dt * 60;

  // Spawn breaches (capped at 3 active)
  nextBreachTime--;
  if (nextBreachTime <= 0 && breaches.length < 3) {
    const bw = 20 + Math.floor(Math.random() * 30);
    const bh = 15 + Math.floor(Math.random() * 15);
    breaches.push({
      wx: SUB_X + 30 + Math.random() * (SUB_W - 60),
      wy: SUB_Y + 20 + Math.random() * (SUB_H - 60),
      w: bw, h: bh,
      size: 0.25 + Math.random() * 0.5 * (df * 0.35),
      progress: 0,
    });
    // sqrt scaling: deep game is tense, not a treadmill
    // surface: ~14-22s between breaches • 800m: ~9-14s
    nextBreachTime = Math.floor((850 + Math.random()*500) / Math.sqrt(df));
    pushAlert('⚠ HULL BREACH DETECTED', '#ff8800', 150);
    sfx('boom'); shake = 8;
  }
  if (nextBreachTime <= 0) nextBreachTime = 120; // retry when at cap

  // Spawn sonar pings — weighted; creatures are threats you must log
  nextPingTime--;
  if (nextPingTime <= 0) {
    const roll = Math.random();
    const type = roll < 0.30 ? 'rock' : roll < 0.60 ? 'debris' : roll < 0.85 ? 'thermal' : 'creature';
    sonarPings.push({
      angle: Math.random()*Math.PI*2,
      dist: 20 + Math.random()*110,
      type, logged: false, age: 0, maxAge: 900,
    });
    if (type === 'creature') { pushAlert('◉ SONAR CONTACT — CHECK ARRAY', '#ffbb00', 160); sfx('ping'); }
    nextPingTime = 200 + Math.floor(Math.random()*260);
  }
  sonarPings.forEach(p => p.age++);
  // Unlogged creatures that expire scrape the hull
  sonarPings.filter(p => p.age >= p.maxAge && p.type === 'creature' && !p.logged).forEach(() => {
    hull -= 6; floodLevel = Math.min(100, floodLevel + 4);
    pushAlert('◉ CREATURE HULL SCRAPE — LOG CONTACTS FASTER!', '#ff4444', 200);
    sfx('scrape'); shake = 12;
  });
  sonarPings = sonarPings.filter(p => p.age < p.maxAge);

  // ── COLLISION COURSE EVENTS ──
  if (!collisionEvt) {
    nextCollisionTime--;
    if (nextCollisionTime <= 0) {
      collisionEvt = { phase:'warn', timer: 390, hits: 0 };  // 6.5s to reach the helm
      pushAlert('🚨 COLLISION COURSE — GET TO HELM!', '#ff2222', 390);
      sfx('klaxon');
    }
  } else if (collisionEvt.phase === 'warn') {
    collisionEvt.timer--;
    if (collisionEvt.timer % 45 === 0) sfx('klaxon');
    if (activeStation === 'steer') {
      collisionEvt.phase = 'dodge'; collisionEvt.timer = 420; collisionEvt.hits = 0;  // 7s dodge run
      helmReset();
      pushAlert('EVASIVE MANEUVERS — DODGE!', '#ffbb00', 120);
    } else if (collisionEvt.timer <= 0) {
      // Nobody at the helm — take the hit
      hull -= 14; floodLevel = Math.min(100, floodLevel + 12);
      breaches.push({
        wx: SUB_X + 30 + Math.random() * (SUB_W - 60),
        wy: SUB_Y + 20 + Math.random() * (SUB_H - 60),
        w: 30, h: 20, size: 0.9, progress: 0,
      });
      pushAlert('💥 IMPACT! HULL COMPROMISED', '#ff2222', 240);
      nextBreachTime = Math.max(nextBreachTime, 700);  // no ambient pile-on after an impact
      sfx('boom'); shake = 22;
      collisionEvt = null;
      nextCollisionTime = Math.floor((1300 + Math.random()*700) / Math.max(1, df*0.8));
    }
  } else if (collisionEvt.phase === 'dodge') {
    collisionEvt.timer--;
    if (activeStation !== 'steer') {
      // walked away mid-dodge — glancing hit
      hull -= 8; floodLevel = Math.min(100, floodLevel + 6);
      pushAlert('💥 GLANCING IMPACT — STAY AT THE HELM NEXT TIME', '#ff4444', 220);
      sfx('boom'); shake = 14;
      collisionEvt = null;
      nextCollisionTime = Math.floor((1300 + Math.random()*700) / Math.max(1, df*0.8));
    } else if (collisionEvt.timer <= 0) {
      const nearBonus = helmNear * 15;
      if (collisionEvt.hits <= 1) {
        bonusScore += 150 + nearBonus;
        pushAlert('✔ EVADED — +150' + (nearBonus ? '  •  ' + helmNear + ' NEAR MISS +' + nearBonus : ''), '#39ff14', 220);
        sfx('chime');
      } else {
        bonusScore += nearBonus;
        pushAlert('ROUGH RIDE — CONTACT AVOIDED' + (nearBonus ? '  +' + nearBonus : ''), '#ffbb00', 180);
      }
      collisionEvt = null;
      nextCollisionTime = Math.floor((1300 + Math.random()*700) / Math.max(1, df*0.8));
    }
  }

  // ambient hull creaks, more often when deep
  if (Math.random() < 0.0015 * df) sfx('creak');
  if (shake > 0) shake *= 0.88;

  // Win / lose
  if (oxygen <= 0 || hull <= 0 || fuel <= 0) {
    state = 'dead';
    saveBest();
    sfx('boom');
    return;
  }
  if (depth >= maxDepth) {
    state = 'win';
    bonusScore += 500; score += 500;   // completion bonus
    saveBest();
    sfx('chime');
    return;
  }

  // ── PLAYER MOVEMENT ─────────────────────────────────────
  if (!activeStation) {
    if (keys['a'] || keys['arrowleft'])  { player.x -= player.speed; player.facing = -1; player.walkCycle += 0.25; }
    if (keys['d'] || keys['arrowright']) { player.x += player.speed; player.facing = 1;  player.walkCycle += 0.25; }
    player.x = Math.max(SUB_X + 10, Math.min(SUB_X + SUB_W - 10, player.x));
    player.y = FLOOR_Y - player.h;

    // Open station
    if (keys['e'] || keys[' ']) {
      const near = nearStation();
      if (near) openStation(near.id);
    }
    if (keys['escape']) closeStation();
  } else {
    if (keys['escape']) closeStation();
    updateMinigame(activeStation);
  }

  // ── BUBBLES ─────────────────────────────────────────────
  bubbles.forEach(b => {
    b.y += b.vy; b.x += Math.sin(frameCount * 0.02 + b.y) * 0.3;
    if (b.y < -5) { b.y = H + 5; b.x = Math.random() * W; }
  });

  // Score from depth + logs + earned bonuses
  score = Math.floor(depth * 10 + logEntries.length * 50 + bonusScore);
}

function openStation(id) {
  activeStation = id;
  if (id === 'steer') {
    steerY = 240; steerVY = 0; steerScrollX = 0;
    obstacles = [];
  }
}

function closeStation() {
  activeStation = null;
  weldTarget = null;
}

// ─── MINIGAME UPDATES ────────────────────────────────────

function updateMinigame(id) {
  if (id === 'hull')   updateHullRepair();
  if (id === 'steer')  updateSteering();
  if (id === 'oxygen') updateOxygen();
  if (id === 'fuel')   updateFuel();
  if (id === 'notes')  updateNotes();
}

// 1. HULL REPAIR — trace the torch along each crack to weld it shut
function updateHullRepair() {
  const TORCH_R = 15;      // how close the torch must be to a segment
  const WELD_RATE = 0.055; // per-frame fill on a touched segment (~1.4s per breach of 5 segs)
  breaches.forEach(b => ensureCrack(b));

  if (mouse.down) {
    let touching = false;
    breaches.forEach(b => {
      b.segs.forEach(s => {
        if (s.prog >= 1) return;
        const mx2 = (s.x1 + s.x2) / 2, my2 = (s.y1 + s.y2) / 2;
        if (Math.hypot(mouse.x - mx2, mouse.y - my2) < TORCH_R) {
          s.prog = Math.min(1, s.prog + WELD_RATE);
          touching = true;
          // torch sparks
          if (frameCount % 2 === 0) {
            const a2 = Math.random() * Math.PI * 2, sp2 = 1 + Math.random() * 2.4;
            weldSparks.push({ x: mouse.x, y: mouse.y, vx: Math.cos(a2)*sp2, vy: Math.sin(a2)*sp2 - 1, life: 16, col: Math.random()<0.5?'#ffd24a':'#ff8833' });
          }
          if (s.prog >= 1) {
            // seam pop + steam
            for (let k = 0; k < 5; k++)
              weldSparks.push({ x: mx2, y: my2, vx: (Math.random()-0.5)*1.4, vy: -0.8-Math.random(), life: 24, col: '#cfe4ee' });
            sfx('valve');
          }
        }
      });
    });
    if (touching && frameCount % 6 === 0) sfx('weld');
  }

  // spray from unsealed segments (intensity = leak size)
  breaches.forEach(b => {
    b.segs.forEach(s => {
      if (s.prog >= 1) return;
      if (Math.random() < 0.10 + b.size * 0.10) {
        const mx2 = (s.x1 + s.x2)/2, my2 = (s.y1 + s.y2)/2;
        sprayFx.push({ x: mx2, y: my2, vx: (Math.random()-0.5)*2.2, vy: 0.6+Math.random()*1.6, life: 22 });
      }
    });
  });

  // completion
  for (let i = breaches.length - 1; i >= 0; i--) {
    if (segDone(breaches[i])) {
      breaches.splice(i, 1);
      floodLevel = Math.max(0, floodLevel - 20);
      hull = Math.min(100, hull + 6);
      nextBreachTime = Math.max(nextBreachTime, 800 + Math.floor(Math.random()*350));
      sfx('chime');
      pushAlert('✔ BREACH SEALED', '#39ff14', 120);
    }
  }

  // particles
  for (let i = weldSparks.length-1; i >= 0; i--) { const p2 = weldSparks[i]; p2.x += p2.vx; p2.y += p2.vy; p2.vy += 0.12; p2.life--; if (p2.life <= 0) weldSparks.splice(i,1); }
  for (let i = sprayFx.length-1; i >= 0; i--) { const p2 = sprayFx[i]; p2.x += p2.vx; p2.y += p2.vy; p2.vy += 0.08; p2.life--; if (p2.life <= 0) sprayFx.splice(i,1); }
}

// 2. HELM — EVASION RUN (remade)
const HELM_VP = { x: 50, y: 78, w: W - 100, h: 268 };
function updateSteering() {
  const VP = HELM_VP;
  const dodging = collisionEvt && collisionEvt.phase === 'dodge';
  const scroll = dodging ? 4.6 + depth / 250 : 1.2;
  steerScrollX += scroll;
  if (helmInvuln > 0) helmInvuln--;

  // ── movement: W/S rise-dive + A/D fore-aft, with momentum & bank ──
  if (keys['w'] || keys['arrowup'])   steerVY -= 0.42;
  if (keys['s'] || keys['arrowdown']) steerVY += 0.42;
  if (keys['a'] || keys['arrowleft'])  helmVX -= 0.35;
  if (keys['d'] || keys['arrowright']) helmVX += 0.35;
  steerVY *= 0.90; helmVX *= 0.88;
  steerY += steerVY; helmX += helmVX;
  steerY = Math.max(24, Math.min(VP.h - 24, steerY));
  helmX  = Math.max(0,  Math.min(VP.w * 0.45, helmX));

  const subX = VP.x + 56 + helmX;         // screen-space sub centre
  const subY = VP.y + steerY;

  // wake bubbles
  if (frameCount % 3 === 0) helmWake.push({ x: subX - 22, y: subY + (Math.random()-0.5)*8, r: 1+Math.random()*2, life: 30 });
  for (let i = helmWake.length-1; i >= 0; i--) { const b2=helmWake[i]; b2.x -= scroll*0.7; b2.y -= 0.2; b2.life--; if (b2.life<=0) helmWake.splice(i,1); }

  // ── spawn threats only while dodging ──
  if (dodging && frameCount % Math.max(14, 34 - Math.floor(depth/40)) === 0) {
    const roll = Math.random();
    const sx2 = VP.x + VP.w + 40;
    if (roll < 0.34) {           // rock (sometimes a pillar from top/bottom)
      if (Math.random() < 0.35) {
        const fromTop = Math.random() < 0.5;
        const len = 70 + Math.random()*90;
        obstacles.push({ type:'pillar', x: sx2, y: fromTop ? 0 : VP.h - len, w: 26 + Math.random()*14, h: len, warned: false });
      } else {
        const r2 = 14 + Math.random()*16;
        obstacles.push({ type:'rock', x: sx2, y: 30 + Math.random()*(VP.h-60), r: r2, rot: Math.random()*6, warned: false, passed: false });
      }
    } else if (roll < 0.70) {    // proximity mine
      obstacles.push({ type:'mine', x: sx2, y: 30 + Math.random()*(VP.h-60), r: 10, bobP: Math.random()*6, armed: false, warned: false, passed: false });
    } else {                     // tumbling debris
      obstacles.push({ type:'debris', x: sx2, y: 20 + Math.random()*(VP.h-40), r: 8 + Math.random()*6, rot: 0, vr: (Math.random()-0.5)*0.15, vy2: (Math.random()-0.5)*0.6, warned: false, passed: false });
    }
  }

  // ── move + behave ──
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= scroll;
    if (o.type === 'debris') { o.y += o.vy2; o.rot += o.vr; }
    if (o.type === 'mine') {
      o.y += Math.sin(frameCount*0.06 + o.bobP) * 0.3;
      const d2 = Math.hypot(o.x - subX, o.y + VP.y - subY);
      if (d2 < 78 && !o.armed) { o.armed = true; }
      if (o.armed && frameCount % 14 === 0 && d2 < 78) sfx('beep');
      if (o.armed && d2 < 40) {
        // detonate
        for (let k=0;k<16;k++){const a2=Math.random()*Math.PI*2,s2=1+Math.random()*3.5;
          helmFx.push({x:o.x,y:o.y,vx:Math.cos(a2)*s2,vy:Math.sin(a2)*s2,life:26,col:k%3?'#ff8833':'#ffd24a'});}
        sfx('boom'); shake = 12;
        if (d2 < 52 && helmInvuln <= 0) helmHit(3);
        obstacles.splice(i,1); continue;
      }
    }
    // collisions + near misses (rock/pillar/mine/debris)
    {
      const oy = (o.type === 'pillar') ? 0 : o.y;
      let hit = false, dist2 = 999;
      if (o.type === 'pillar') {
        const inX = subX + 16 > o.x && subX - 16 < o.x + o.w;
        const inY = subY - VP.y + 9 > o.y && subY - VP.y - 9 < o.y + o.h;
        hit = inX && inY;
        if (inX && !hit) dist2 = Math.min(Math.abs(subY - VP.y - o.y), Math.abs(subY - VP.y - (o.y + o.h)));
      } else {
        dist2 = Math.hypot(o.x - subX, o.y + VP.y - subY) - (o.r + 12);
        hit = dist2 < 0;
      }
      if (hit && helmInvuln <= 0) {
        helmHit(4);
        for (let k=0;k<8;k++){const a2=Math.random()*Math.PI*2;helmFx.push({x:subX,y:subY,vx:Math.cos(a2)*2,vy:Math.sin(a2)*2,life:18,col:'#aabbcc'});}
        if (o.type !== 'pillar') { obstacles.splice(i,1); continue; }
      }
      // near miss when it passes behind the sub
      if (!o.passed && o.type !== 'pillar' && o.x < subX - 18) {
        o.passed = true;
        if (dist2 < 22 && dist2 >= 0 && dodging) {
          helmNear++;
          helmPops.push({ x: subX + 14, y: subY - 16, txt: 'CLOSE!', life: 40 });
          sfx('ping');
        }
      }
    }
    if (o.x < VP.x - 140) obstacles.splice(i,1);
  }

  // fx + popups
  for (let i=helmFx.length-1;i>=0;i--){const p2=helmFx[i];p2.x+=p2.vx;p2.y+=p2.vy;p2.vy+=0.05;p2.life--;if(p2.life<=0)helmFx.splice(i,1);}
  for (let i=helmPops.length-1;i>=0;i--){const p2=helmPops[i];p2.y-=0.5;p2.life--;if(p2.life<=0)helmPops.splice(i,1);}
}
function helmHit(dmg) {
  if (collisionEvt && collisionEvt.phase === 'dodge') collisionEvt.hits++;
  hull -= dmg;
  floodLevel = Math.min(100, floodLevel + 2.5);
  helmInvuln = 42;
  sfx('boom'); shake = 10;
}
// 3. OXYGEN VALVES
function updateOxygen() {
  valvePressure -= 0.06 * depthFactor();  // balanced: was 0.08
  if (valvePressure <= 0) {
    // Pressure burst — reset
    valvePressure = 100;
    generateValveTarget();
    oxygen -= 10;
  }
  if (valveSuccess > 0) valveSuccess--;
}

// 4. FUEL PUMP
function updateFuel() {
  pumpAngle = (pumpAngle + 0.04 + depth * 0.00008) % (Math.PI * 2);
  pumpTarget = (pumpTarget + 0.018) % (Math.PI * 2);
  if (pumpFlash > 0) pumpFlash--;
  if (pumpFail > 0) pumpFail--;
}

// 5. SONAR LOG
let sonarTag = 0;
function updateNotes() {
  sonarSweep = (sonarSweep + 0.014) % (Math.PI * 2);
  if (logSuccess > 0) logSuccess--;
  // The sweep REVEALS contacts — undetected pings are invisible
  sonarPings.forEach(p => {
    const diff = Math.abs(normalizeAngle(p.angle - sonarSweep));
    if (diff < 0.15 && !p.detected) {
      p.detected = true;
      p.tag = String.fromCharCode(65 + (sonarTag++ % 26));   // A, B, C…
      sfx('ping');
    }
  });
}
// geometry shared by draw + clicks (and tests)
function sonarRowRect(i) {
  return { x: 310 + (W - 340) - 46, y: 100 + i * 30, w: 40, h: 20 };
}
const CONTACT_META = {
  rock:     { col:'#9aa4b0', shape:'▲', reward:'+3 HULL'  },
  debris:   { col:'#5db85d', shape:'■', reward:'+6 FUEL'  },
  thermal:  { col:'#ff9933', shape:'◆', reward:'+6 O²'    },
  creature: { col:'#ff4433', shape:'●', reward:'+150 PTS' },
};

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI*2;
  while (a < -Math.PI) a += Math.PI*2;
  return a;
}

// ── DRAW ─────────────────────────────────────────────────
function draw() {
  ctx.fillStyle = P.black;
  ctx.fillRect(0, 0, W, H);

  if (state === 'intro') { drawIntro(); return; }
  if (state === 'dead')  { drawDeadScreen(); drawBestLine(); return; }
  if (state === 'win')   { drawWinScreen(); drawBestLine(); return; }

  // Screen shake
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // Ocean background
  drawOcean();

  // Sub exterior + interior
  drawSub();

  // HUD
  drawHUD();

  // Active minigame overlay
  if (activeStation) drawMinigame(activeStation);
  else { drawStationPrompts(); drawWayfinder(); }

  // Flood overlay
  if (floodLevel > 0) {
    ctx.save();
    ctx.globalAlpha = floodLevel * 0.004;
    ctx.fillStyle = P.water;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    // Water ripple lines at bottom
    const wy = H - (floodLevel / 100) * 80;
    ctx.save();
    ctx.globalAlpha = floodLevel * 0.006;
    ctx.fillStyle = '#002244';
    ctx.fillRect(0, wy, W, H - wy);
    ctx.restore();
  }

  // Red-alert lighting during a collision warning
  if (collisionEvt && collisionEvt.phase === 'warn') {
    ctx.save();
    ctx.globalAlpha = 0.10 + Math.sin(frameCount * 0.25) * 0.08;
    ctx.fillStyle = '#ff2200';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,40,20,' + (0.4 + Math.sin(frameCount*0.25)*0.3).toFixed(2) + ')';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W-6, H-6);
  }

  drawAlerts();
  ctx.restore(); // end shake

  if (state === 'paused') drawPauseOverlay();

  mouse.clicked = false;
}

// ── ALERT BANNERS ────────────────────────────────────────
function currentDirective() {
  if (collisionEvt && collisionEvt.phase === 'warn')
    return { txt: '🚨 GET TO HELM — IMPACT IN ' + (collisionEvt.timer/60).toFixed(1) + 's', col: '#ff3322', st: 'steer', bar: collisionEvt.timer/390 };
  if (collisionEvt && collisionEvt.phase === 'dodge')
    return { txt: '◎ DODGE ' + (collisionEvt.timer/60).toFixed(1) + 's — HITS ' + collisionEvt.hits, col: '#ffbb00', st: null };
  if (breaches.length > 0)
    return { txt: '⚠ SEAL ' + breaches.length + ' BREACH' + (breaches.length>1?'ES':'') + ' — HULL REPAIR', col: '#ff8800', st: 'hull' };
  if (floodLevel > 45)
    return { txt: '⚠ FLOODING — PUMPS RUN WHEN HULL IS SEALED', col: '#4aa8dd', st: 'hull' };
  if (oxygen < 35)
    return { txt: 'LOW O² — RUN THE VALVE SEQUENCE', col: '#38b6ff', st: 'oxygen' };
  if (fuel < 35)
    return { txt: 'LOW FUEL — WORK THE PUMP', col: '#ffaa00', st: 'fuel' };
  const threat = sonarPings.find(p => p.type === 'creature' && !p.logged);
  if (threat)
    return { txt: '◉ UNLOGGED CONTACT — CHECK SONAR', col: '#ffbb00', st: 'notes' };
  return { txt: 'ALL SYSTEMS NOMINAL — DIVING ▼', col: '#39ff14', st: null };
}

function drawAlerts() {
  // ── ONE status pill: what should I be doing right now? ──
  const d = currentDirective();
  const inStation = !!activeStation;
  const nominal = d.st === null && !collisionEvt;
  // inside a station: the header explains the task — only interrupt for real problems
  const showPill = !inStation || !nominal;
  const pillY = inStation ? H - 40 : 36;   // bottom placement avoids the station header
  if (showPill) {
    ctx.font = 'bold 9px monospace';
    const dw = ctx.measureText(d.txt).width + 30;
    ctx.fillStyle = 'rgba(0,4,10,0.85)';
    ctx.fillRect(W/2 - dw/2, pillY, dw, 17);
    ctx.strokeStyle = d.col; ctx.lineWidth = 1;
    ctx.strokeRect(W/2 - dw/2, pillY, dw, 17);
    if (d.bar !== undefined) {   // urgency bar inside the pill (collision countdown)
      ctx.fillStyle = 'rgba(255,50,30,0.25)';
      ctx.fillRect(W/2 - dw/2 + 1, pillY + 1, (dw - 2) * d.bar, 15);
    }
    ctx.fillStyle = d.col;
    ctx.textAlign = 'center';
    ctx.fillText(d.txt, W/2, pillY + 12);
  }

  // ── transient toasts (max 2) ──
  for (let i = alerts.length - 1; i >= 0; i--) {
    alerts[i].timer--;
    if (alerts[i].timer <= 0) alerts.splice(i, 1);
  }
  while (alerts.length > 2) alerts.shift();
  alerts.forEach((a, i) => {
    const y = inStation ? (H - 58 - i * 16) : (68 + i * 18);
    const fade = Math.min(1, a.timer / 40);
    ctx.save();
    ctx.globalAlpha = fade * 0.9;
    ctx.font = '8px monospace';
    const tw2 = ctx.measureText(a.text).width + 20;
    ctx.fillStyle = 'rgba(0,4,8,0.75)';
    ctx.fillRect(W/2 - tw2/2, y - 10, tw2, 14);
    ctx.fillStyle = a.color;
    ctx.textAlign = 'center';
    ctx.fillText(a.text, W/2, y);
    ctx.restore();
  });
}

// ── WAYFINDING: bouncing arrow over the station you need ──
function drawWayfinder() {
  if (activeStation) return;
  const d = currentDirective();
  if (!d.st) return;
  const s = STATIONS.find(st => st.id === d.st);
  if (!s) return;
  const bob = Math.sin(frameCount * 0.15) * 4;
  const ay = SUB_Y - 26 + bob;
  ctx.fillStyle = d.col;
  ctx.beginPath();
  ctx.moveTo(s.x, ay + 10);
  ctx.lineTo(s.x - 7, ay);
  ctx.lineTo(s.x + 7, ay);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(s.name, s.x, ay - 5);
}
// ── PAUSE ────────────────────────────────────────────────
function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(0,2,6,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = P.green;
  ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillText('◼ PAUSED', W/2, H/2 - 10);
  ctx.fillStyle = P.dim;
  ctx.font = '10px monospace';
  ctx.fillText('ESC / ENTER — RESUME', W/2, H/2 + 20);
}

function drawBestLine() {
  const best = getBest();
  ctx.fillStyle = '#ffbb00';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('BEST SCORE: ' + best + (score >= best && score > 0 ? '  ★ NEW RECORD!' : ''), W/2, H - 28);
}

// ── OCEAN ────────────────────────────────────────────────
function drawOcean() {
  // Deep gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  const d = depth / maxDepth;
  grad.addColorStop(0, `rgba(0,${Math.floor(20*(1-d))},${Math.floor(40*(1-d))},1)`);
  grad.addColorStop(1, `rgba(0,0,0,1)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Depth particles / particulate
  ctx.fillStyle = `rgba(100,150,200,0.04)`;
  for (let i = 0; i < 60; i++) {
    const px = (i * 137 + frameCount * 0.3) % W;
    const py = (i * 79 + frameCount * 0.15) % H;
    ctx.fillRect(px, py, 1, 1);
  }

  // Bubbles
  bubbles.forEach(b => {
    ctx.save();
    ctx.globalAlpha = b.alpha * 0.4;
    ctx.strokeStyle = '#4488aa';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });


}

// ── SUB INTERIOR ─────────────────────────────────────────
function drawSub() {
  // Sub outer hull
  ctx.fillStyle = P.hullDk;
  roundRect(SUB_X - 20, SUB_Y - 10, SUB_W + 40, SUB_H + 20, 18);
  ctx.fillStyle = P.hull;
  roundRect(SUB_X, SUB_Y, SUB_W, SUB_H, 12);

  // Hull rivet lines
  ctx.strokeStyle = P.rivet;
  ctx.lineWidth = 1;
  for (let rx = SUB_X + 20; rx < SUB_X + SUB_W; rx += 40) {
    ctx.beginPath(); ctx.moveTo(rx, SUB_Y); ctx.lineTo(rx, SUB_Y + SUB_H); ctx.stroke();
  }
  // Rivets
  ctx.fillStyle = P.rivet;
  for (let rx = SUB_X + 20; rx < SUB_X + SUB_W; rx += 40) {
    for (let ry = SUB_Y + 8; ry < SUB_Y + SUB_H; ry += SUB_H - 16) {
      ctx.beginPath(); ctx.arc(rx, ry, 2, 0, Math.PI*2); ctx.fill();
    }
  }

  // Floor line
  ctx.strokeStyle = P.steel;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(SUB_X, FLOOR_Y);
  ctx.lineTo(SUB_X + SUB_W, FLOOR_Y);
  ctx.stroke();

  // Flood water inside sub
  if (floodLevel > 5) {
    const fw = floodLevel / 100;
    const fy = FLOOR_Y - (SUB_Y + SUB_H - FLOOR_Y) * fw * 3;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#001830';
    ctx.fillRect(SUB_X, Math.max(SUB_Y, fy), SUB_W, SUB_Y + SUB_H - Math.max(SUB_Y, fy));
    // Water surface ripple
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#004466';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let wx = SUB_X; wx < SUB_X + SUB_W; wx += 8) {
      const wy2 = Math.max(SUB_Y, fy) + Math.sin(frameCount * 0.08 + wx * 0.1) * 2;
      if (wx === SUB_X) ctx.moveTo(wx, wy2); else ctx.lineTo(wx, wy2);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Draw breaches (cracks in hull)
  breaches.forEach((b, i) => {
    if (i === weldTarget) {
      // Welding flash
      ctx.fillStyle = `rgba(255,180,0,${0.3 + Math.sin(frameCount*0.5)*0.2})`;
    } else {
      ctx.fillStyle = P.rust;
    }
    ctx.fillRect(b.wx - SUB_X + SUB_X, b.wy, b.w, b.h);
    // Crack lines
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(b.wx, b.wy);
    ctx.lineTo(b.wx + b.w*0.4, b.wy + b.h*0.6);
    ctx.lineTo(b.wx + b.w, b.wy + b.h);
    ctx.stroke();
    // Water drip
    if (frameCount % 8 < 4) {
      ctx.fillStyle = '#003355';
      ctx.fillRect(b.wx + b.w/2, b.wy + b.h, 2, 4 + (frameCount%16));
    }
    // Progress bar if being welded
    if (i === weldTarget && b.progress > 0) {
      ctx.fillStyle = '#222';
      ctx.fillRect(b.wx, b.wy - 6, b.w, 4);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(b.wx, b.wy - 6, b.w * b.progress, 4);
    }
  });

  // Draw stations
  STATIONS.forEach(s => {
    const near = nearStation();
    const isNear = near && near.id === s.id;
    ctx.fillStyle = isNear ? P.greenDk : P.steel;
    ctx.fillRect(s.x - 18, SUB_Y + 10, 36, 100);
    ctx.strokeStyle = isNear ? P.green : P.rivet;
    ctx.lineWidth = 1;
    ctx.strokeRect(s.x - 18, SUB_Y + 10, 36, 100);
    // Screen glow
    ctx.fillStyle = isNear ? P.greenDm : '#0a0e0a';
    ctx.fillRect(s.x - 12, SUB_Y + 16, 24, 30);
    // Icon
    ctx.fillStyle = isNear ? P.green : P.dim;
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(s.icon, s.x, SUB_Y + 38);
    // Label
    ctx.fillStyle = isNear ? P.textBrt : P.text;
    ctx.font = '5px monospace';
    ctx.fillText(s.name, s.x, SUB_Y + 98);
    if (isNear) {
      ctx.fillStyle = P.green;
      ctx.font = '6px monospace';
      ctx.fillText('[E]', s.x, SUB_Y + 108);
    }
  });

  // Draw player
  drawPlayer();
}

function drawPlayer() {
  const px = player.x, py = player.y;
  const f = player.facing;
  const bob = Math.sin(player.walkCycle) * 1.5;

  ctx.save();
  ctx.translate(px, py + bob);
  ctx.scale(f, 1);

  // Body — naval uniform
  ctx.fillStyle = '#1a2a3a';
  ctx.fillRect(-4, 0, 8, 10);
  // Head
  ctx.fillStyle = '#c8a070';
  ctx.fillRect(-3, -8, 6, 7);
  // Cap
  ctx.fillStyle = '#0a1a2a';
  ctx.fillRect(-4, -10, 8, 3);
  ctx.fillRect(-5, -8, 10, 1);
  // Legs
  const legOff = Math.sin(player.walkCycle) * 2;
  ctx.fillStyle = '#1a2a3a';
  ctx.fillRect(-3, 10, 2, 6 + legOff);
  ctx.fillRect(1, 10, 2, 6 - legOff);
  // Boots
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-4, 16 + legOff, 3, 2);
  ctx.fillRect(1, 16 - legOff, 3, 2);

  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────
function drawHUD() {
  // ── single clean top strip ──
  ctx.fillStyle = 'rgba(0,3,8,0.82)';
  ctx.fillRect(0, 0, W, 30);
  ctx.strokeStyle = 'rgba(57,255,20,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(W, 30); ctx.stroke();

  function gauge(x, label, val, col, warnBelow) {
    const v = Math.max(0, Math.min(100, val));
    const warn = v < warnBelow;
    const crit = v < warnBelow * 0.6;
    const flash = crit && Math.floor(frameCount/12)%2===0;
    ctx.fillStyle = flash ? '#ff3322' : (warn ? '#ffaa33' : '#8fa8b8');
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(label, x, 13);
    // slim bar
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, 17, 86, 7);
    ctx.fillStyle = flash ? '#ff3322' : (warn ? '#ffaa33' : col);
    ctx.fillRect(x, 17, 86 * v/100, 7);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeRect(x, 17, 86, 7);
    ctx.fillStyle = '#cfe0ea';
    ctx.font = '8px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(Math.floor(v), x + 92, 24);
  }
  gauge(12,  'HULL', hull,   '#e05a2a', 35);
  gauge(136, 'O²',   oxygen, '#38b6ff', 35);
  gauge(260, 'FUEL', fuel,   '#ffaa00', 35);
  // flood gauge only when it matters
  if (floodLevel > 4) {
    const fv = Math.min(100, floodLevel);
    const fWarn = fv > 45;
    ctx.fillStyle = fWarn && Math.floor(frameCount/12)%2===0 ? '#ff3322' : '#4aa8dd';
    ctx.font = 'bold 8px monospace'; ctx.textAlign = 'left';
    ctx.fillText('FLOOD', 384, 13);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(384, 17, 60, 7);
    ctx.fillStyle = fWarn ? '#ff5533' : '#4aa8dd';
    ctx.fillRect(384, 17, 60 * fv/100, 7);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeRect(384, 17, 60, 7);
  }

  // right side: depth + score, compact
  ctx.fillStyle = '#8fa8b8';
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('DEPTH', W - 96, 13);
  ctx.fillStyle = '#cfe0ea';
  ctx.fillText(Math.floor(depth) + ' / ' + maxDepth + 'm', W - 10, 13);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(W - 150, 17, 140, 7);
  ctx.fillStyle = P.green;
  ctx.fillRect(W - 150, 17, 140 * (depth/maxDepth), 7);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.strokeRect(W - 150, 17, 140, 7);
  ctx.fillStyle = '#7a92a2';
  ctx.font = '7px monospace';
  ctx.fillText('SCORE ' + score, W - 10, H - 6);
}
// ── STATION PROMPTS ───────────────────────────────────────
function drawStationPrompts() {
  const near = nearStation();
  if (!near) return;
  const label = '[E]  OPEN ' + near.name;
  ctx.font = 'bold 9px monospace';
  const pw = ctx.measureText(label).width + 28;
  ctx.fillStyle = 'rgba(0,10,4,0.88)';
  ctx.fillRect(W/2 - pw/2, H - 52, pw, 20);
  ctx.strokeStyle = P.green; ctx.lineWidth = 1;
  ctx.strokeRect(W/2 - pw/2, H - 52, pw, 20);
  ctx.fillStyle = P.green;
  ctx.textAlign = 'center';
  ctx.fillText(label, W/2, H - 39);
}
// ── MINIGAME PANEL ────────────────────────────────────────
const STATION_INFO = {
  hull:   { title:'⚙ HULL REPAIR',   hint:'Hold LMB and trace the torch along each crack' },
  steer:  { title:'◎ HELM',          hint:'W/S dive-rise, A/D fore-aft — dodge the rocks and mines' },
  oxygen: { title:'◈ O² TANKS',      hint:'Click the valves in the order shown' },
  fuel:   { title:'⛽ ENGINE',       hint:'Hit PUMP when the needle is in the green' },
  notes:  { title:'◉ SONAR / LOG',   hint:'The sweep reveals contacts — LOG each one for the reward shown' },
};
function drawMinigame(id) {
  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.86)';
  ctx.fillRect(0, 40, W, H - 60);

  // Unified header: what am I doing + how
  const info = STATION_INFO[id];
  ctx.fillStyle = 'rgba(0,10,4,0.9)';
  ctx.fillRect(0, 40, W, 24);
  ctx.strokeStyle = 'rgba(57,255,20,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 64); ctx.lineTo(W, 64); ctx.stroke();
  ctx.fillStyle = P.green;
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillText(info.title, 12, 56);
  ctx.fillStyle = '#8fa8b8';
  ctx.font = '8px monospace';
  ctx.fillText(info.hint, 130, 56);
  ctx.fillStyle = P.dim;
  ctx.textAlign = 'right';
  ctx.fillText('[ESC] CLOSE', W - 10, 56);

  if (id === 'hull')   drawHullMinigame();
  if (id === 'steer')  drawSteerMinigame();
  if (id === 'oxygen') drawOxygenMinigame();
  if (id === 'fuel')   drawFuelMinigame();
  if (id === 'notes')  drawNotesMinigame();
}

// ─────────────────────────────────────────────────────────
// 1. HULL REPAIR MINIGAME
// ─────────────────────────────────────────────────────────
function mapToMiniX(wx) { return 60 + ((wx - SUB_X) / SUB_W) * (W - 120); }
function mapToMiniY(wy) { return 80 + ((wy - SUB_Y) / SUB_H) * 200; }

function drawHullMinigame() {
  // ── sub cross-section ──
  const DX = 60, DY = 74, DW = W - 120, DH = 226;
  ctx.fillStyle = '#070c12';
  ctx.fillRect(DX, DY, DW, DH);
  // hull plating
  ctx.strokeStyle = '#1d2836'; ctx.lineWidth = 1;
  for (let gx = DX; gx < DX + DW; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, DY); ctx.lineTo(gx, DY + DH); ctx.stroke(); }
  for (let gy = DY; gy < DY + DH; gy += 40) { ctx.beginPath(); ctx.moveTo(DX, gy); ctx.lineTo(DX + DW, gy); ctx.stroke(); }
  // rivets at intersections
  ctx.fillStyle = '#2a3a4e';
  for (let gx = DX; gx <= DX + DW; gx += 40) for (let gy = DY; gy <= DY + DH; gy += 40)
    ctx.fillRect(gx - 1, gy - 1, 2, 2);
  // frame
  ctx.strokeStyle = P.steel; ctx.lineWidth = 2;
  ctx.strokeRect(DX, DY, DW, DH);
  ctx.fillStyle = P.dim; ctx.font = '6px monospace';
  ctx.textAlign = 'left';  ctx.fillText('BOW', DX + 6, DY + 12);
  ctx.textAlign = 'right'; ctx.fillText('STERN', DX + DW - 6, DY + 12);

  if (breaches.length === 0) {
    ctx.fillStyle = P.green;
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('✔ HULL INTEGRITY: NOMINAL', W/2, DY + DH/2);
    ctx.fillStyle = '#5a7282'; ctx.font = '8px monospace';
    ctx.fillText('no cracks detected — nice welding', W/2, DY + DH/2 + 16);
  }

  // ── water spray (behind cracks) ──
  sprayFx.forEach(p2 => {
    ctx.save(); ctx.globalAlpha = p2.life / 22 * 0.7;
    ctx.fillStyle = '#5ab4e8';
    ctx.fillRect(p2.x - 1, p2.y - 1, 2, 3);
    ctx.restore();
  });

  // ── cracks ──
  breaches.forEach(b => {
    ensureCrack(b);
    const total = b.segs.length, done = b.segs.filter(s => s.prog >= 1).length;
    b.segs.forEach(s => {
      const mx2 = (s.x1 + s.x2)/2, my2 = (s.y1 + s.y2)/2;
      if (s.prog >= 1) {
        // welded bead — bright seam
        ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
        ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
      } else {
        // open crack — dark gash with red glow, partially filled by progress
        ctx.save();
        ctx.shadowBlur = 7; ctx.shadowColor = '#ff3322';
        ctx.strokeStyle = '#12060a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
        ctx.restore();
        ctx.strokeStyle = '#5a1620'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
        if (s.prog > 0) {   // partial weld creeping along the segment
          ctx.strokeStyle = '#ff8833'; ctx.lineWidth = 4; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(s.x1, s.y1);
          ctx.lineTo(s.x1 + (s.x2 - s.x1) * s.prog, s.y1 + (s.y2 - s.y1) * s.prog);
          ctx.stroke();
        }
      }
    });
    // per-crack progress chip
    const cx = mapToMiniX(b.wx), cy = mapToMiniY(b.wy);
    ctx.fillStyle = 'rgba(0,4,10,0.8)';
    ctx.fillRect(cx - 20, cy - 34, 40, 11);
    ctx.fillStyle = done === total ? '#39ff14' : '#ffaa33';
    ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
    ctx.fillText(done + ' / ' + total, cx, cy - 25);
  });

  // ── weld sparks (on top) ──
  weldSparks.forEach(p2 => {
    ctx.save(); ctx.globalAlpha = p2.life / 20;
    ctx.fillStyle = p2.col;
    ctx.fillRect(p2.x - 1.5, p2.y - 1.5, 3, 3);
    ctx.restore();
  });

  // ── the torch cursor ──
  if (mouse.y > DY - 10 && mouse.y < DY + DH + 10) {
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.rotate(0.6);
    ctx.fillStyle = '#3a4552';
    ctx.fillRect(2, 2, 16, 5);                    // handle
    ctx.fillStyle = '#556070';
    ctx.fillRect(-2, 0, 6, 8);                    // nozzle
    if (mouse.down) {
      const fl = 2 + Math.sin(frameCount * 0.8) * 1.4;
      ctx.fillStyle = '#8fd4ff';
      ctx.beginPath(); ctx.arc(-4, 3, fl + 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-4, 3, fl, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // hint strip
  ctx.fillStyle = '#7a92a2';
  ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
  ctx.fillText('HOLD LMB and TRACE the torch along each crack segment', W/2, DY + DH + 20);
}
// ─────────────────────────────────────────────────────────
// 2. STEERING MINIGAME
// ─────────────────────────────────────────────────────────
function drawSteerMinigame() {
  const VP = HELM_VP;
  const dodging = collisionEvt && collisionEvt.phase === 'dodge';
  const scroll = dodging ? 4.6 + depth / 250 : 1.2;

  // ── viewport ──
  const dg = ctx.createLinearGradient(0, VP.y, 0, VP.y + VP.h);
  const dark = Math.min(0.85, depth / maxDepth);
  dg.addColorStop(0, 'rgb(0,' + Math.floor(26*(1-dark)) + ',' + Math.floor(52*(1-dark)) + ')');
  dg.addColorStop(1, '#000308');
  ctx.fillStyle = dg;
  ctx.fillRect(VP.x, VP.y, VP.w, VP.h);

  ctx.save();
  ctx.beginPath(); ctx.rect(VP.x, VP.y, VP.w, VP.h); ctx.clip();

  // parallax rock silhouettes (2 layers)
  for (let L = 0; L < 2; L++) {
    const spd = L === 0 ? 0.25 : 0.55;
    ctx.fillStyle = L === 0 ? 'rgba(10,22,36,0.7)' : 'rgba(16,32,50,0.7)';
    for (let i = 0; i < 7; i++) {
      const bx = VP.x + ((i * 173 - steerScrollX * spd) % (VP.w + 120) + VP.w + 120) % (VP.w + 120) - 60;
      const bh = 34 + ((i * 53) % 60) + L * 20;
      ctx.beginPath();
      ctx.moveTo(bx - 30, VP.y + VP.h);
      ctx.lineTo(bx, VP.y + VP.h - bh);
      ctx.lineTo(bx + 34, VP.y + VP.h);
      ctx.closePath(); ctx.fill();
    }
  }
  // speed particles
  ctx.fillStyle = 'rgba(120,180,230,0.25)';
  for (let i = 0; i < 26; i++) {
    const px2 = VP.x + ((i * 131 - steerScrollX * (1.4 + (i%3)*0.5)) % VP.w + VP.w) % VP.w;
    const py2 = VP.y + (i * 61) % VP.h;
    ctx.fillRect(px2, py2, dodging ? 5 : 2, 1);
  }

  const subX = VP.x + 56 + helmX;
  const subY = VP.y + steerY;

  // wake bubbles
  helmWake.forEach(b2 => {
    ctx.save(); ctx.globalAlpha = b2.life / 30 * 0.5;
    ctx.strokeStyle = '#7fc4e8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b2.x, b2.y, b2.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  });

  // ── obstacles ──
  obstacles.forEach(o => {
    if (o.type === 'rock') {
      ctx.save(); ctx.translate(o.x, VP.y + o.y); ctx.rotate(o.rot);
      ctx.fillStyle = '#3a4150';
      ctx.beginPath();
      for (let a2 = 0; a2 < 7; a2++) {
        const ang = a2/7*Math.PI*2;
        const rr = o.r * (0.8 + ((a2*37+Math.floor(o.rot*10))%10)/33);
        ctx[a2?'lineTo':'moveTo'](Math.cos(ang)*rr, Math.sin(ang)*rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#525c70'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }
    else if (o.type === 'pillar') {
      ctx.fillStyle = '#333a48';
      ctx.fillRect(o.x, VP.y + o.y, o.w, o.h);
      ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 1.5;
      ctx.strokeRect(o.x, VP.y + o.y, o.w, o.h);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(o.x + 3, VP.y + o.y, 4, o.h);
    }
    else if (o.type === 'mine') {
      const my = VP.y + o.y;
      const blink = o.armed && Math.floor(frameCount/8)%2===0;
      // chain
      ctx.strokeStyle = '#2a3340'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(o.x, my + o.r); ctx.lineTo(o.x, VP.y + VP.h); ctx.stroke();
      // spikes
      ctx.strokeStyle = blink ? '#ff5533' : '#556070'; ctx.lineWidth = 2;
      for (let a2 = 0; a2 < 8; a2++) {
        const ang = a2/8*Math.PI*2 + 0.4;
        ctx.beginPath();
        ctx.moveTo(o.x + Math.cos(ang)*o.r, my + Math.sin(ang)*o.r);
        ctx.lineTo(o.x + Math.cos(ang)*(o.r+5), my + Math.sin(ang)*(o.r+5));
        ctx.stroke();
      }
      ctx.fillStyle = blink ? '#88222a' : '#3d4552';
      ctx.beginPath(); ctx.arc(o.x, my, o.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = blink ? '#ff6644' : '#697588';
      ctx.beginPath(); ctx.arc(o.x - 3, my - 3, 3, 0, Math.PI*2); ctx.fill();
    }
    else if (o.type === 'debris') {
      ctx.save(); ctx.translate(o.x, VP.y + o.y); ctx.rotate(o.rot);
      ctx.fillStyle = '#2c3a2c';
      ctx.fillRect(-o.r, -o.r*0.5, o.r*2, o.r);
      ctx.strokeStyle = '#455845'; ctx.lineWidth = 1;
      ctx.strokeRect(-o.r, -o.r*0.5, o.r*2, o.r);
      ctx.restore();
    }

  });

  // fx particles
  helmFx.forEach(p2 => {
    ctx.save(); ctx.globalAlpha = p2.life / 26;
    ctx.fillStyle = p2.col;
    ctx.fillRect(p2.x - 2, p2.y - 2, 4, 4);
    ctx.restore();
  });

  // ── the submarine ──
  const bank = Math.max(-0.35, Math.min(0.35, steerVY * 0.06));
  ctx.save();
  ctx.translate(subX, subY);
  ctx.rotate(bank);
  if (helmInvuln % 8 < 5) {
    // hull
    ctx.fillStyle = '#4a5a3a';
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a6c48';
    ctx.beginPath(); ctx.ellipse(0, -2, 22, 6, 0, 0, Math.PI*2); ctx.fill();
    // sail
    ctx.fillStyle = '#3e4c30';
    ctx.fillRect(-6, -16, 12, 9);
    // scope
    ctx.fillStyle = '#5a6c48'; ctx.fillRect(1, -20, 2, 5);
    // viewport dot
    ctx.fillStyle = '#9fd4e8';
    ctx.beginPath(); ctx.arc(10, -1, 2.5, 0, Math.PI*2); ctx.fill();
    // spinning prop
    const ps = Math.sin(frameCount * 0.9);
    ctx.fillStyle = '#7a8a68';
    ctx.fillRect(-26, -1 - 7*Math.abs(ps), 3, 14*Math.abs(ps) + 2);
    // fin
    ctx.fillStyle = '#3e4c30';
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-27, -7); ctx.lineTo(-24, 0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // near-miss popups
  helmPops.forEach(p2 => {
    ctx.save(); ctx.globalAlpha = Math.min(1, p2.life / 20);
    ctx.fillStyle = '#ffe9a0';
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left';
    ctx.fillText(p2.txt, p2.x, p2.y);
    ctx.restore();
  });

  // ── incoming-threat telegraphs on right edge ──
  obstacles.forEach(o => {
    if (o.x > VP.x + VP.w && o.x < VP.x + VP.w + 130) {
      const ty = VP.y + (o.type === 'pillar' ? o.y + o.h/2 : o.y);
      ctx.fillStyle = o.type === 'mine' ? '#ff5533' : '#ffaa33';
      ctx.beginPath();
      ctx.moveTo(VP.x + VP.w - 4, ty);
      ctx.lineTo(VP.x + VP.w - 14, ty - 6);
      ctx.lineTo(VP.x + VP.w - 14, ty + 6);
      ctx.closePath(); ctx.fill();
    }
  });

  ctx.restore(); // clip

  // frame
  ctx.strokeStyle = dodging ? '#ffaa33' : P.steel;
  ctx.lineWidth = 2;
  ctx.strokeRect(VP.x, VP.y, VP.w, VP.h);

  // ── status strip under viewport ──
  const sy2 = VP.y + VP.h + 16;
  ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
  if (dodging) {
    ctx.fillStyle = '#ffbb00';
    ctx.fillText('W/S DIVE-RISE   A/D FORE-AFT   •   ' + (collisionEvt.timer/60).toFixed(1) + 's   •   HITS ' + collisionEvt.hits + '   •   NEAR ' + helmNear, W/2, sy2);
  } else {
    ctx.fillStyle = '#7a92a2';
    ctx.fillText('STANDING BY — RESPOND HERE DURING COLLISION ALERTS', W/2, sy2);
    ctx.fillStyle = '#4a6272';
    ctx.font = '8px monospace';
    ctx.fillText('you can practice the controls now: W/S and A/D', W/2, sy2 + 14);
  }
}
// ─────────────────────────────────────────────────────────
// 3. OXYGEN VALVE PUZZLE
// ─────────────────────────────────────────────────────────
function drawOxygenMinigame() {

  // Pressure gauge
  const gx = W/2, gy = 110, gr = 45;
  ctx.strokeStyle = '#003355';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI*2); ctx.stroke();
  const pressAngle = -Math.PI + (valvePressure/100)*Math.PI;
  ctx.strokeStyle = valvePressure < 30 ? P.red : '#00aaff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(gx, gy, gr, -Math.PI, pressAngle);
  ctx.stroke();
  ctx.fillStyle = '#00aaff';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.floor(valvePressure)}%`, gx, gy + 4);
  ctx.fillStyle = P.dim;
  ctx.font = '6px monospace';
  ctx.fillText('PRESSURE', gx, gy + 14);

  // Valve sequence display
  ctx.fillStyle = P.text;
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('OPEN VALVES IN ORDER:', W/2, 170);

  // Target sequence display
  valveTarget.forEach((vi, si) => {
    const vx = W/2 - (valveTarget.length-1)*35 + si*70;
    const done = si < valveStep;
    const isCurrent = si === valveStep;
    ctx.strokeStyle = done ? P.green : (isCurrent ? P.amber : P.dim);
    ctx.lineWidth = 2;
    ctx.strokeRect(vx - 14, 178, 28, 28);
    ctx.fillStyle = done ? P.greenDk : '#0a0e0a';
    ctx.fillRect(vx - 13, 179, 26, 26);
    ctx.fillStyle = done ? P.green : (isCurrent ? P.amber : P.dim);
    ctx.font = 'bold 12px monospace';
    ctx.fillText(vi + 1, vx, 196);
    if (si < valveTarget.length - 1) {
      ctx.fillStyle = P.dim;
      ctx.font = '10px monospace';
      ctx.fillText('→', vx + 28, 196);
    }
  });

  // Draw 5 valves
  const valveLabels = ['V-1','V-2','V-3','V-4','V-5'];
  valveLabels.forEach((vl, i) => {
    const vx = W/2 - 160 + i * 80;
    const vy = 240;
    const isOn = valveState[i];
    const isNext = valveTarget[valveStep] === i;

    // Valve body
    ctx.fillStyle = isOn ? P.greenDk : '#111';
    ctx.fillRect(vx - 18, vy, 36, 36);
    ctx.strokeStyle = isNext ? P.amber : (isOn ? P.green : P.steel);
    ctx.lineWidth = 2;
    ctx.strokeRect(vx - 18, vy, 36, 36);

    // Valve wheel
    ctx.strokeStyle = isOn ? P.green : P.dim;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(vx, vy+18, 12, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx-12, vy+18); ctx.lineTo(vx+12, vy+18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx, vy+6); ctx.lineTo(vx, vy+30); ctx.stroke();

    // Label
    ctx.fillStyle = isNext ? P.amber : P.dim;
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(vl, vx, vy + 48);

    // Click detection
    if (mouse.clicked) {
      if (mouse.x > vx-18 && mouse.x < vx+18 && mouse.y > vy && mouse.y < vy+36) {
        handleValveClick(i);
      }
    }

    // Glow if next
    if (isNext) {
      ctx.save();
      ctx.globalAlpha = 0.2 + Math.sin(frameCount*0.1)*0.1;
      ctx.fillStyle = P.amber;
      ctx.fillRect(vx-18, vy, 36, 36);
      ctx.restore();
    }
  });

  // Success flash
  if (valveSuccess > 0) {
    ctx.save();
    ctx.globalAlpha = valveSuccess/30 * 0.4;
    ctx.fillStyle = P.green;
    ctx.fillRect(0, 40, W, H-60);
    ctx.restore();
    ctx.fillStyle = P.green;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('O² REPLENISHED!', W/2, 310);
  }


}

function handleValveClick(i) {
  const expected = valveTarget[valveStep];
  if (i === expected) {
    sfx('valve');
    valveState[i] = true;
    valveStep++;
    if (valveStep >= valveTarget.length) {
      // Success!
      oxygen = Math.min(100, oxygen + 32);   // balanced: was +20
      valvePressure = 100;
      valveSuccess = 60;
      sfx('chime');
      generateValveTarget();
    }
  } else {
    // Wrong — reset
    valveStep = 0;
    valveState = [false,false,false,false,false];
    valvePressure = Math.max(10, valvePressure - 20);
  }
}

// ─────────────────────────────────────────────────────────
// 4. FUEL PUMP MINIGAME
// ─────────────────────────────────────────────────────────
function drawFuelMinigame() {

  // Pump dial
  const cx = W/2, cy = 190, r = 90;

  // Outer ring
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

  // Target zone (green arc)
  const tw = pumpTargetWidth;
  ctx.strokeStyle = '#00cc00';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(cx, cy, r, pumpTarget - tw/2, pumpTarget + tw/2);
  ctx.stroke();

  // Needle
  ctx.strokeStyle = P.amber;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 6; ctx.shadowColor = P.amber;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(pumpAngle) * r * 0.85, cy + Math.sin(pumpAngle) * r * 0.85);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Centre hub
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.amber;
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();

  // Is needle in zone?
  const inZone = (() => {
    let diff = Math.abs(pumpAngle - pumpTarget) % (Math.PI*2);
    if (diff > Math.PI) diff = Math.PI*2 - diff;
    return diff < tw/2;
  })();

  // Fuel level arc
  ctx.strokeStyle = fuel > 20 ? '#ff8800' : '#ff2200';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 16, -Math.PI/2, -Math.PI/2 + (fuel/100)*Math.PI*2);
  ctx.stroke();

  // PUMP button
  const btnY = 310;
  const pressing = mouse.down && mouse.y > btnY-20 && mouse.y < btnY+20 && mouse.x > cx-50 && mouse.x < cx+50;
  ctx.fillStyle = pressing ? '#004400' : '#002200';
  ctx.fillRect(cx-50, btnY-20, 100, 40);
  ctx.strokeStyle = inZone ? P.green : '#444';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx-50, btnY-20, 100, 40);
  ctx.fillStyle = inZone ? P.green : P.dim;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('PUMP', cx, btnY + 4);

  // Handle click
  if (mouse.clicked) {
    if (mouse.x > cx-50 && mouse.x < cx+50 && mouse.y > btnY-20 && mouse.y < btnY+20) {
      if (inZone) {
        // dead-centre = perfect pump
        let diff = Math.abs(pumpAngle - pumpTarget) % (Math.PI*2);
        if (diff > Math.PI) diff = Math.PI*2 - diff;
        const perfect = diff < pumpTargetWidth / 6;
        fuel = Math.min(100, fuel + (perfect ? 22 : 14));   // balanced: was +8
        pumpHits++;
        pumpFlash = perfect ? 40 : 20;
        sfx(perfect ? 'chime' : 'pump');
      } else {
        pumpMisses++;
        pumpFail = 20;
        fuel = Math.max(0, fuel - 1); // balanced: was -2
        sfx('pump');
      }
    }
  }

  if (pumpFlash > 0) {
    ctx.fillStyle = P.green;
    ctx.font = 'bold 11px monospace';
    ctx.fillText(pumpFlash > 25 ? '★ PERFECT +22' : '+FUEL', cx + 70, cy - 10);
  }
  if (pumpFail > 0) {
    ctx.fillStyle = P.red;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('MISFIRE!', cx + 60, cy - 10);
  }

  ctx.fillStyle = P.dim;
  ctx.font = '7px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HITS: ${pumpHits}   MISSES: ${pumpMisses}   FUEL: ${Math.floor(fuel)}%`, W/2, 365);

}

// ─────────────────────────────────────────────────────────
// 5. SONAR / NOTES MINIGAME
// ─────────────────────────────────────────────────────────
function drawNotesMinigame() {
  // ── scope (left) ──
  const sx = 60, sy = 74, sr = 108;
  const scx = sx + sr, scy = sy + sr;
  ctx.fillStyle = '#010e01';
  ctx.beginPath(); ctx.arc(scx, scy, sr, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = P.greenDk; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(scx, scy, sr, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = '#0a2a0a'; ctx.lineWidth = 1;
  [36,72].forEach(rr => { ctx.beginPath(); ctx.arc(scx, scy, rr, 0, Math.PI*2); ctx.stroke(); });
  ctx.beginPath(); ctx.moveTo(scx-sr, scy); ctx.lineTo(scx+sr, scy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(scx, scy-sr); ctx.lineTo(scx, scy+sr); ctx.stroke();

  // sweep + trail
  ctx.strokeStyle = 'rgba(57,255,20,0.7)'; ctx.lineWidth = 1.5;
  ctx.shadowBlur = 4; ctx.shadowColor = P.green;
  ctx.beginPath(); ctx.moveTo(scx, scy);
  ctx.lineTo(scx + Math.cos(sonarSweep)*sr, scy + Math.sin(sonarSweep)*sr);
  ctx.stroke(); ctx.shadowBlur = 0;
  ctx.save();
  for (let t = 1; t < 12; t++) {
    const ta = sonarSweep - t * 0.06;
    ctx.globalAlpha = (1 - t/12) * 0.15;
    ctx.strokeStyle = P.green; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(scx, scy);
    ctx.lineTo(scx + Math.cos(ta)*sr, scy + Math.sin(ta)*sr);
    ctx.stroke();
  }
  ctx.restore();

  // ── contacts on the scope: ONLY once the sweep has revealed them ──
  sonarPings.forEach(p => {
    if (!p.detected) return;
    const bx = scx + Math.cos(p.angle) * p.dist;
    const by = scy + Math.sin(p.angle) * p.dist;
    const m = CONTACT_META[p.type];
    ctx.save();
    if (p.logged) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = P.green;
      ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
      ctx.fillText('✔', bx, by + 3);
      ctx.restore();
      return;
    }
    // creature: pulsing ring that SHRINKS as the scrape timer runs out
    if (p.type === 'creature') {
      const tLeft = 1 - p.age / p.maxAge;
      ctx.strokeStyle = 'rgba(255,68,51,' + (0.4 + Math.sin(frameCount*0.2)*0.25).toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(bx, by, 6 + tLeft * 14, 0, Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle = m.col;
    ctx.shadowBlur = 6; ctx.shadowColor = m.col;
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(m.shape, bx, by + 3);
    ctx.shadowBlur = 0;
    // tag letter linking to the list
    ctx.fillStyle = '#dff5df';
    ctx.font = 'bold 7px monospace';
    ctx.fillText(p.tag || '?', bx, by - 8);
    ctx.restore();
  });

  // legend with REWARDS under the scope
  ctx.font = '7px monospace'; ctx.textAlign = 'left';
  let lgx = sx - 4;
  Object.keys(CONTACT_META).forEach(k => {
    const m = CONTACT_META[k];
    ctx.fillStyle = m.col;
    const txt = m.shape + ' ' + k.toUpperCase() + ' ' + m.reward;
    ctx.fillText(txt, lgx, sy + sr*2 + 16);
    lgx += ctx.measureText(txt).width + 12;
  });

  // ── CONTACTS panel (right): the thing you act on ──
  const lx = 310, ly = 74, lw = W - 340, lh = 226;
  ctx.fillStyle = '#010e01';
  ctx.fillRect(lx, ly, lw, lh);
  ctx.strokeStyle = P.greenDk; ctx.lineWidth = 1;
  ctx.strokeRect(lx, ly, lw, lh);
  ctx.fillStyle = P.green;
  ctx.font = 'bold 8px monospace'; ctx.textAlign = 'left';
  ctx.fillText('CONTACTS — LOG THEM FOR THE REWARD', lx + 8, ly + 14);
  ctx.strokeStyle = P.greenDk;
  ctx.beginPath(); ctx.moveTo(lx+2, ly+20); ctx.lineTo(lx+lw-2, ly+20); ctx.stroke();

  const live = sonarPings.filter(p => p.detected && !p.logged);
  if (live.length === 0) {
    ctx.fillStyle = '#4a6a4a';
    ctx.font = '8px monospace'; ctx.textAlign = 'center';
    ctx.fillText('sweeping…', lx + lw/2, ly + 70);
    ctx.fillText('contacts appear as the beam passes them', lx + lw/2, ly + 84);
  }
  live.slice(0, 5).forEach((p, i) => {
    const m = CONTACT_META[p.type];
    const ry = 92 + i * 30;
    // row bg
    ctx.fillStyle = p.type === 'creature' && Math.floor(frameCount/16)%2===0 ? 'rgba(80,20,16,0.5)' : 'rgba(10,26,10,0.6)';
    ctx.fillRect(lx + 4, ry - 2, lw - 8, 26);
    // tag + shape + name
    ctx.fillStyle = '#dff5df';
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left';
    ctx.fillText('[' + (p.tag||'?') + ']', lx + 8, ry + 10);
    ctx.fillStyle = m.col;
    ctx.fillText(m.shape + ' ' + p.type.toUpperCase(), lx + 32, ry + 10);
    // reward
    ctx.fillStyle = '#b9f5b9';
    ctx.font = '8px monospace';
    ctx.fillText(m.reward, lx + 32, ry + 21);
    // creature countdown
    if (p.type === 'creature') {
      const secs = Math.max(0, (p.maxAge - p.age) / 60);
      ctx.fillStyle = '#ff6655';
      ctx.textAlign = 'right';
      ctx.fillText('scrapes hull in ' + secs.toFixed(0) + 's', lx + lw - 54, ry + 21);
      ctx.textAlign = 'left';
    }
    // LOG button
    const rb = sonarRowRect(i);
    const hov = mouse.x > rb.x && mouse.x < rb.x + rb.w && mouse.y > rb.y && mouse.y < rb.y + rb.h;
    ctx.fillStyle = hov ? '#0a3a0a' : '#062406';
    ctx.fillRect(rb.x, rb.y, rb.w, rb.h);
    ctx.strokeStyle = hov ? P.green : P.greenDk; ctx.lineWidth = 1;
    ctx.strokeRect(rb.x, rb.y, rb.w, rb.h);
    ctx.fillStyle = P.green;
    ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
    ctx.fillText('LOG', rb.x + rb.w/2, rb.y + 13);
    if (mouse.clicked && hov) logContact(p);
  });

  // recent log lines (small, informational)
  ctx.fillStyle = '#2f5a2f';
  ctx.font = '6px monospace'; ctx.textAlign = 'left';
  logEntries.slice(-4).forEach((entry, i) => {
    ctx.fillText(entry, lx + 8, ly + lh - 40 + i * 9);
  });

  if (logSuccess > 0) {
    ctx.fillStyle = P.green;
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('✔ LOGGED', lx + lw/2, ly + lh + 16);
  }
}
function logContact(sp) {
  sp.logged = true;
  const bearing = Math.floor(((sp.angle + Math.PI*2) % (Math.PI*2)) * (180/Math.PI));
  logEntries.push('T+' + Math.floor(missionTime/60).toString().padStart(3,'0') + '  ' + sp.type.toUpperCase().padEnd(8) + ' BRG:' + bearing.toString().padStart(3,'0'));
  bonusScore += 75;
  if (sp.type === 'debris')   { fuel = Math.min(100, fuel + 6);     pushAlert('SALVAGED DEBRIS  +6 FUEL', '#39ff14', 140); }
  if (sp.type === 'thermal')  { oxygen = Math.min(100, oxygen + 6); pushAlert('THERMAL VENT TAPPED  +6 O²', '#39ff14', 140); }
  if (sp.type === 'rock')     { hull = Math.min(100, hull + 3);     pushAlert('CHARTED HAZARD  +3 HULL', '#39ff14', 140); }
  if (sp.type === 'creature') { bonusScore += 150;                  pushAlert('SPECIES CATALOGED  +150', '#39ff14', 140); }
  logSuccess = 40;
  sfx('chime');
}
function drawIntro() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Scanlines
  for (let y = 0; y < H; y += 3) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, y, W, 1);
  }

  // Sub silhouette
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(100, H/2 - 20, 440, 40);
  ctx.fillStyle = '#081208';
  ctx.fillRect(80, H/2 - 14, 480, 28);
  // Periscope
  ctx.fillRect(300, H/2 - 40, 6, 22);
  ctx.fillRect(296, H/2 - 44, 14, 6);

  introTimer++;
  const lines = [
    { t:'U.S.S. MARIANA DEEP', y:80, c:'#39ff14', s:14, d:0 },
    { t:'COLD WAR DEEP DIVE PROGRAM', y:100, c:'#1a7a08', s:8, d:30 },
    { t:'CLASSIFIED — EYES ONLY', y:112, c:'#cc2200', s:7, d:60 },
    { t:'', y:140, c:'#000', s:7, d:90 },
    { t:'TARGET DEPTH: 800m', y:152, c:'#888', s:8, d:100 },
    { t:'MISSION: REACH MAX DEPTH AND RETURN DATA', y:164, c:'#666', s:7, d:120 },
    { t:'', y:200, c:'#000', s:7, d:150 },
    { t:'MANAGE 5 CRITICAL SYSTEMS.', y:380, c:'#39ff14', s:8, d:160 },
    { t:'WASD — MOVE BETWEEN STATIONS   E — INTERACT   ESC — CLOSE', y:396, c:'#1a7a08', s:7, d:170 },
  ];
  lines.forEach(l => {
    if (introTimer < l.d) return;
    const age = introTimer - l.d;
    const al = Math.min(1, age/20);
    ctx.save(); ctx.globalAlpha = al;
    ctx.fillStyle = l.c; ctx.font = `${l.s}px monospace`; ctx.textAlign = 'center';
    ctx.fillText(l.t, W/2, l.y);
    ctx.restore();
  });

  // Station icons preview
  if (introTimer > 140) {
    const icons = [
      { icon:'⚙', name:'HULL', col:'#cc4400' },
      { icon:'◎', name:'HELM', col:'#ffaa00' },
      { icon:'◈', name:'O²',   col:'#00aaff' },
      { icon:'⛽', name:'FUEL', col:'#ff8800' },
      { icon:'◉', name:'SONAR',col:'#39ff14' },
    ];
    const al = Math.min(1, (introTimer-140)/30);
    ctx.save(); ctx.globalAlpha = al;
    icons.forEach((ic, i) => {
      const ix = W/2 - 160 + i * 80;
      ctx.fillStyle = '#0a0e0a';
      ctx.fillRect(ix-20, 310, 40, 52);
      ctx.strokeStyle = ic.col;
      ctx.lineWidth = 1;
      ctx.strokeRect(ix-20, 310, 40, 52);
      ctx.fillStyle = ic.col;
      ctx.font = '16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ic.icon, ix, 338);
      ctx.font = '6px monospace';
      ctx.fillText(ic.name, ix, 356);
    });
    ctx.restore();
  }

  if (introTimer > 190) {
    const al = Math.min(1,(introTimer-190)/30) * (0.6+Math.sin(frameCount*0.1)*0.4);
    ctx.save(); ctx.globalAlpha = al;
    ctx.fillStyle = '#39ff14';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('[ PRESS ENTER TO DIVE ]', W/2, H - 30);
    ctx.restore();
  }
}

// ── DEAD / WIN ─────────────────────────────────────────────
function drawDeadScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowBlur = 20; ctx.shadowColor = P.red;
  ctx.fillStyle = P.redBrt;
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SUBMARINE LOST', W/2, H/2 - 50);
  ctx.restore();
  ctx.fillStyle = '#663333';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  const reason = hull <= 0 ? 'HULL FAILURE — CRUSHED BY PRESSURE' :
                 oxygen <= 0 ? 'OXYGEN DEPLETED — CREW ASPHYXIATED' :
                 'FUEL EXHAUSTED — DRIFTING IN THE DEEP';
  ctx.fillText(reason, W/2, H/2 - 24);
  ctx.fillStyle = '#444';
  ctx.fillText(`DEPTH REACHED: ${Math.floor(depth)}m / ${maxDepth}m`, W/2, H/2 - 6);
  ctx.fillText(`CONTACTS LOGGED: ${logEntries.length}`, W/2, H/2 + 10);
  ctx.fillText(`SCORE: ${score}`, W/2, H/2 + 26);
  if (Math.floor(frameCount/25)%2===0) {
    ctx.fillStyle = P.red;
    ctx.fillText('[ ENTER — TRY AGAIN ]', W/2, H/2 + 60);
  }
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowBlur = 20; ctx.shadowColor = P.green;
  ctx.fillStyle = P.green;
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('MISSION ACCOMPLISHED', W/2, H/2 - 50);
  ctx.restore();
  ctx.fillStyle = P.greenDk;
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('U.S.S. MARIANA DEEP — TARGET DEPTH REACHED', W/2, H/2 - 26);
  ctx.fillText(`CONTACTS LOGGED: ${logEntries.length}`, W/2, H/2 - 6);
  ctx.fillText(`HULL INTEGRITY: ${Math.floor(hull)}%`, W/2, H/2 + 10);
  ctx.fillText(`SCORE: ${score}`, W/2, H/2 + 26);
  if (Math.floor(frameCount/25)%2===0) {
    ctx.fillStyle = P.green;
    ctx.fillText('[ ENTER — PLAY AGAIN ]', W/2, H/2 + 60);
  }
}

// ── UTIL ──────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
  ctx.fill();
}

// ── LOOP ──────────────────────────────────────────────────
function loop() {
  frameCount++;
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
